</style></head><body><div id="commission-prototype" aria-label="团队分润配置原型"></div><script>(()=>{
const root=document.getElementById('commission-prototype');
const catalog=[{id:'income',name:'工单结算收入',type:'money',unit:'元',fullCoverage:true,exclusive:true}];
const teams=['六尺巷总团队','桐城调解团队','安庆调解团队'];
const empty=()=>({version:3,projects:[],rules:[],fallback:'manual',notes:'',status:'草稿'});
let team=teams[0],s=empty(),step=1,isOpen=true,preview=false,editor=null,newProject=false,message='',resetScroll=true,trial=400;
const drafts={},records={};
try{const stored=JSON.parse(localStorage.getItem('liuchixiang-profit-prototype-v3')||'{}');for(const t of teams)if(stored[t]?.config?.version===3)records[t]=stored[t];if(records[team])s=structuredClone(records[team].config);}catch(e){}
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const project=id=>s.projects.find(p=>p.id===id),metric=p=>catalog.find(m=>m.id===p.metric),condition=(p,c)=>project(p)?.conditions.find(x=>x.id===c);
const button=(text,action,attrs='')=>`<button type="button" data-action="${action}" ${attrs}>${text}</button>`;
const options=(list,v)=>list.map(([id,name])=>`<option value="${esc(id)}" ${v===id?'selected':''}>${esc(name)}</option>`).join('');
const select=(list,v,bind)=>`<select data-bind="${bind}">${options(list,v)}</select>`;
const input=(value,bind)=>`<input type="number" min="0" step="0.01" data-bind="${bind}" value="${Number.isFinite(value)?value:''}">`;
const fmt=v=>Number.isInteger(v)?String(v):String(Number(v.toFixed(2)));
const range=c=>c.max===null?`金额 ${c.li?'≥':'>'} ${fmt(c.min)} 元`:`${fmt(c.min)} ${c.li?'≤':'<'} 金额 ${c.ui?'≤':'<'} ${fmt(c.max)} 元`;
const cents=c=>({lo:Math.round(c.min*100)+(c.li?0:1),hi:c.max===null?Infinity:Math.round(c.max*100)-(c.ui?0:1)});
const precise=v=>Number.isFinite(v)&&v>=0&&Math.abs(v*100-Math.round(v*100))<1e-7;
function conditionErrors(c){const e=[];if(!c.name.trim())e.push('请填写条件名称');if(!precise(c.min)||(c.max!==null&&!precise(c.max)))e.push('金额边界须为非负数，最多两位小数');if(cents(c).lo>cents(c).hi)e.push('区间内没有有效金额，请检查上下限');return e;}
function coverage(p){const e=p.conditions.flatMap(c=>conditionErrors(c));if(e.length)return [...new Set(e)];if(!p.conditions.length)return ['请至少创建一个条件'];const intervals=p.conditions.map(cents).sort((a,b)=>a.lo-b.lo);let end=-1,gap=false,overlap=false;for(const v of intervals){if(v.lo>end+1)gap=true;if(v.lo<=end)overlap=true;end=Math.max(end,v.hi);}if(end!==Infinity)gap=true;if(gap)e.push('金额范围存在遗漏，需覆盖0元至无上限');if(overlap)e.push('金额区间重叠，请调整条件边界');return e;}
function matchCond(p,c,value){const found=condition(p,c);if(!found||!precise(value))return false;const v=cents(found),n=Math.round(value*100);return n>=v.lo&&n<=v.hi;}
function matchRule(r,value){return combine(r.groups.map(g=>combine(g.refs.map(ref=>matchCond(ref.project,ref.condition,value)),g.logic)),r.logic);}
const combine=(values,logic)=>values.length>0&&(logic==='and'?values.every(Boolean):values.some(Boolean));
function sampleAmounts(){const set=new Set([0]);for(const p of s.projects)for(const c of p.conditions){const v=cents(c);for(const n of [v.lo-1,v.lo,v.lo+1,v.hi-1,v.hi,v.hi+1])if(Number.isFinite(n)&&n>=0)set.add(n);}return [...set].sort((a,b)=>a-b).map(n=>n/100);}
function allErrors(includeRules=true){const e=s.projects.length?s.projects.flatMap(p=>coverage(p).map(x=>metric(p).name+'：'+x)):['请先新建条件项目'];if(!includeRules)return e;if(!s.rules.length)e.push('请至少添加一条规则');s.rules.forEach((r,k)=>{if(!r.groups.length||r.groups.some(g=>!g.refs.length||g.refs.some(ref=>!condition(ref.project,ref.condition))))e.push(`规则${k+1}：请完整选择条件`);if((r.mode!=='percent'&&!precise(r.fixed))||(r.mode!=='fixed'&&(!Number.isFinite(r.rate)||r.rate<0)))e.push(`规则${k+1}：请输入有效的非负分润参数`);});if(e.length)return [...new Set(e)];const samples=sampleAmounts();for(let a=0;a<s.rules.length;a++)for(let b=a+1;b<s.rules.length;b++){const witness=samples.find(v=>matchRule(s.rules[a],v)&&matchRule(s.rules[b],v));if(witness!==undefined)e.push(`规则${a+1}与规则${b+1}重叠（例如收入${fmt(witness)}元），请调整组合条件`);}s.rules.forEach((r,k)=>{if(!samples.some(v=>matchRule(r,v)))e.push(`规则${k+1}的条件无法同时成立，请检查且／或关系`);});return e;}
function formula(r){if(r.mode==='percent')return `工单结算收入 × ${r.rate}%`;if(r.mode==='fixed')return `固定 ${r.fixed} 元`;if(r.mode==='floor')return `工单结算收入 × ${r.rate}%，最低 ${r.fixed} 元`;return `${r.fixed} 元 + 工单结算收入 × ${r.rate}%`;}
function describeRef(ref){const p=project(ref.project),c=condition(ref.project,ref.condition);if(!p||!c)return '【请选择条件】';const name=metric(p).name;if(c.max===null)return `${name}${c.li?'不少于':'超过'}${fmt(c.min)}元`;if(c.min===0&&c.li)return `${name}${c.ui?'不超过':'低于'}${fmt(c.max)}元`;if(c.min===c.max)return `${name}等于${fmt(c.min)}元`;return `${name}在${fmt(c.min)}至${fmt(c.max)}元之间（${c.li?'含':'不含'}下限，${c.ui?'含':'不含'}上限）`;}
function description(r){return `满足以下${r.logic==='and'?'全部':'任一'}条件组时：\n`+r.groups.map((g,k)=>`${k+1}. `+g.refs.map(describeRef).join(g.logic==='and'?'，且':'，或')).join('；\n')+`。\n分润金额 = ${formula(r)}。`;}
function calculate(r,v){const percent=v*r.rate/100;return r.mode==='fixed'?r.fixed:r.mode==='percent'?percent:r.mode==='floor'?Math.max(percent,r.fixed):r.fixed+percent;}
function keep(){drafts[team]=structuredClone(s);}
function mutate(){s.status='草稿';message='';keep();render();}
function say(text){message=text;const el=root.querySelector('#cp-message');if(el){el.textContent=text;el.className='cp-toast';el.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function changeTeam(t){keep();team=t;s=structuredClone(drafts[t]||records[t]?.config||empty());step=1;isOpen=true;preview=false;editor=null;newProject=false;message='';resetScroll=true;render();}
function dashboard(){return `<header class="app-top"><div class="brand">六尺巷 <span>法律服务平台 / 内部分润</span></div><span class="demo-badge">交互原型 · 本地模拟</span></header><div class="app-layout"><aside class="sidebar"><div class="nav-title">业务管理</div><div>工作台</div><div>案件管理</div><div>调解团队</div><div class="nav-active">内部分润</div><div>结算记录</div></aside><main class="dashboard" ${isOpen?'inert':''}><div class="cp-head"><div><div class="cp-muted">团队管理 / 分润配置</div><h1>团队分润管理</h1></div><span class="cp-tag">本地原型，未连接业务系统</span></div><div class="team-grid">${teams.map(t=>`<section class="team-card"><div class="team-avatar">${esc(t[0])}</div><h2>${esc(t)}</h2><p class="cp-muted">${records[t]?'已保存 '+records[t].config.rules.length+' 条分润规则':'尚未保存分润方案'}</p><div class="cp-muted">${records[t]?'最近保存：'+esc(records[t].time):'独立配置条件项目与分润公式'}</div>${button('配置分润方案','team:'+t,'class="cp-primary"')}</section>`).join('')}</div><section class="dashboard-note"><h3>配置流程</h3><div class="flow"><span>① 新建条件项目，配置金额条件</span><span>→</span><span>② 组合规则，并设置分润公式</span></div><p class="cp-muted">规则自动编号，每条规则独立预览自然语言描述。</p></section></main></div>`;}
function conditionEditor(p){const c=editor.draft;return `<div class="cp-editor"><h3>${editor.isNew?'新建':'编辑'}条件</h3><label>条件名称<input id="condition-name" maxlength="30" value="${esc(c.name)}" placeholder="例如：中额收入"></label><div class="cp-pair"><label>金额下限（元）<input id="condition-min" type="number" min="0" step="0.01" value="${c.min}"></label><label>金额上限（元）<input id="condition-max" type="number" min="0" step="0.01" placeholder="留空表示无上限" value="${c.max??''}"></label></div><div class="cp-pair"><label class="cp-check"><input id="condition-li" type="checkbox" ${c.li?'checked':''}>包含下限</label><label class="cp-check"><input id="condition-ui" type="checkbox" ${c.ui?'checked':''}>包含上限</label></div><p class="cp-muted">修改后会同步更新引用此条件的组合规则。</p><div class="cp-line">${button('应用条件','save-condition','class="cp-primary"')}${button('取消','cancel-condition')}</div></div>`;}
function conditionsPanel(){return `<div class="section-heading"><div><h2>条件项目配置</h2><p class="cp-muted">选择条件项目后，创建多个条件。金额区间由系统自动检查完整性。</p></div></div>${!s.projects.length?'<div class="empty-project"><h3>尚未创建条件项目</h3><p class="cp-muted">目前支持工单结算收入（金额），后续可扩展其他项目。</p></div>':''}${s.projects.map(p=>{const e=coverage(p);return `<section class="project-card"><header><div><h3>${esc(metric(p).name)} <span class="cp-tag">金额</span></h3><div class="cp-muted">完整覆盖0元至无上限 · 精确到分</div></div>${button('删除项目',`delete-project:${p.id}`,'class="cp-link"')}</header><div class="condition-list"><div class="condition-heading"><span>条件名称</span><span>金额范围</span><span>操作</span></div>${p.conditions.map((c,k)=>`<div class="condition-row"><b>${esc(c.name)}</b><span>${esc(range(c))}</span><div class="condition-actions">${button('编辑',`edit-condition:${p.id}:${c.id}`)}${button('上移',`move-condition:${p.id}:${k}:-1`,k===0?'disabled':'')}${button('下移',`move-condition:${p.id}:${k}:1`,k===p.conditions.length-1?'disabled':'')}${button('删除',`delete-condition:${p.id}:${c.id}`)}</div></div>`).join('')}</div><div class="${e.length?'cp-error':'cp-good'}" role="${e.length?'alert':'status'}">${e.length?'! '+e.join('；'):'✓ 已覆盖全部金额范围，区间无重叠'}</div>${button('＋ 新建条件',`add-condition:${p.id}`,'class="cp-link"')}${editor?.project===p.id?conditionEditor(p):''}</section>`;}).join('')}${button('＋ 新建条件项目','new-project','class="cp-wide"')}${newProject?`<div class="cp-editor"><h3>新建条件项目</h3><label>选择条件项目<select id="project-metric"><option value="">请选择</option>${catalog.map(m=>`<option value="${m.id}" ${s.projects.some(p=>p.metric===m.id)?'disabled':''}>${m.name}（金额）${s.projects.some(p=>p.metric===m.id)?' · 已创建':''}</option>`).join('')}</select></label><p class="cp-muted">每个项目只创建一次，同一项目下可创建多个条件。</p><div class="cp-line">${button('创建项目','create-project','class="cp-primary"')}${button('取消','cancel-project')}</div></div>`:''}`;}
function groupView(r,g,ri,gi){return `<section class="group-card"><div class="cp-line cp-between"><h3>条件组${gi+1}</h3>${button('删除组',`delete-group:${ri}:${gi}`,r.groups.length===1?'disabled':'')}</div><label>组内关系${select([['and','满足全部条件（且）'],['or','满足任一条件（或）']],g.logic,`group-logic:${ri}:${gi}`)}</label>${g.refs.map((ref,fi)=>{const p=project(ref.project),c=condition(ref.project,ref.condition);return `<div class="ref-row"><label>条件项目${select(s.projects.filter(p=>p.id===ref.project||!g.refs.some(x=>x.project===p.id)).map(p=>[p.id,metric(p).name]),ref.project,`ref-project:${ri}:${gi}:${fi}`)}</label><label>选择条件${select([['','请选择条件'],...(p?.conditions||[]).map(c=>[c.id,c.name])],ref.condition,`ref-condition:${ri}:${gi}:${fi}`)}</label><div class="range-hint">${c?esc(range(c)):'选择已配置的条件'}</div>${button('删除',`delete-ref:${ri}:${gi}:${fi}`,g.refs.length===1?'disabled':'')}</div>`;}).join('')}${button('＋ 条件项目',`add-ref:${ri}:${gi}`,`class="cp-link" ${g.refs.length>=s.projects.length?'disabled':''}`)}<span class="cp-muted"> 每组内，同一条件项目仅选择一个条件。</span></section>`;}
function formulaView(r,i){return `<section class="formula-card"><h3>分润公式</h3><div class="formula-fields"><label>计算方式${select([['plus','固定金额＋收入比例'],['percent','按收入比例'],['fixed','固定金额'],['floor','按收入比例，设最低保障']],r.mode,`mode:${i}`)}</label>${r.mode!=='percent'?`<label>${r.mode==='floor'?'最低保障':'固定金额'}（元）${input(r.fixed,`fixed:${i}`)}</label>`:''}${r.mode!=='fixed'?`<label>收入比例（%）${input(r.rate,`rate:${i}`)}</label>`:''}</div><div class="formula-line" id="formula-${i}">分润金额 = ${esc(formula(r))}</div></section>`;}
function rulesPanel(){return `<div class="section-heading"><div><h2>组合规则与分润公式</h2><p class="cp-muted">每条规则组合完成后，直接设置对应公式。规则编号仅用于识别。</p></div></div>${!s.rules.length?'<div class="empty-project"><h3>尚未配置规则</h3><p class="cp-muted">添加规则，选择已创建的条件，并配置分润公式。</p></div>':''}${s.rules.map((r,i)=>`<article class="profit-rule" id="rule-${i}"><header><h3>规则${i+1}</h3><div class="cp-line">${button(r.showDescription?'收起描述':'预览规则',`toggle-description:${i}`,'class="cp-link"')}${button('删除规则',`delete-rule:${i}`,'class="cp-link"')}</div></header><div class="profit-rule-body"><label class="group-logic-label">组间关系${select([['or','满足任一条件组（或）'],['and','满足全部条件组（且）']],r.logic,`rule-logic:${i}`)}</label>${r.groups.map((g,gi)=>`${gi?`<div class="cp-join">${r.logic==='and'?'且':'或'}</div>`:''}${groupView(r,g,i,gi)}`).join('')}${button('＋ 条件组',`add-group:${i}`,'class="cp-link"')}${formulaView(r,i)}${r.showDescription?`<section class="description-card"><h3>规则${i+1} · 自然语言描述</h3><div id="description-${i}" class="description-text" aria-live="polite">${esc(description(r))}</div></section>`:''}</div></article>`).join('')}${button('＋ 添加规则','add-rule','class="cp-wide"')}${s.rules.length?`<section class="trial-card"><h3>方案试算</h3><div class="trial-form"><label>工单结算收入（元）${input(trial,'trial')}</label><div id="trial-result" aria-live="polite"></div></div></section>`:''}<div class="settings-row"><label>未命中任何规则时${select([['manual','转人工核算'],['zero','分润为0元']],s.fallback,'fallback')}</label><label>备注<textarea id="scheme-notes" maxlength="500" placeholder="选填，最多500字">${esc(s.notes)}</textarea></label></div>`;}
function previewPanel(){return `<h2>方案预览</h2><p class="cp-muted">确认规则及公式后保存到当前浏览器。</p><div class="cp-good">✓ 金额覆盖及规则冲突校验通过</div>${s.rules.map((r,i)=>`<section class="preview-rule cp-box"><h3>规则${i+1}</h3><div class="description-text">${esc(description(r))}</div></section>`).join('')}<div class="cp-box">未命中规则时：${s.fallback==='manual'?'转人工核算':'分润为0元'}<br>备注：${esc(s.notes||'未填写')}</div><div class="cp-error">仅保存原型配置，不改变真实分润记录。</div>`;}
function render(){const oldScroll=resetScroll?0:(root.querySelector('.modal-content')?.scrollTop||0);resetScroll=false;root.innerHTML=dashboard()+(isOpen?`<div class="modal-mask"><section class="scheme-modal" role="dialog" aria-modal="true" aria-labelledby="scheme-title"><header class="modal-header"><div><h2 id="scheme-title">配置${esc(team)}调解分润方案</h2><span class="cp-muted">${esc(s.status)} · ${preview?'保存前预览':`第${step}步，共2步`}</span></div>${button('×','close','class="close-button" aria-label="关闭配置弹窗"')}</header><nav class="stepper" aria-label="配置步骤">${['配置条件项目','组合规则与分润公式'].map((name,i)=>button(`<span>${i+1}</span>${name}`,`step:${i+1}`,`class="step ${step===i+1&&!preview?'current':''}"`)).join('')}</nav><div class="modal-content"><div class="notice">先配置条件项目，再组合规则并设置分润公式。金额条件必须完整覆盖；同一笔收入不能同时命中多条规则。</div><div id="cp-message" class="${message?'cp-toast':'cp-hidden'}" role="status" aria-live="polite">${esc(message)}</div>${preview?previewPanel():step===1?conditionsPanel():rulesPanel()}</div><footer class="modal-footer"><span class="cp-muted">${preview?'仅保存在当前浏览器':'未选择的条件项目不作限制'}</span><div class="cp-line">${button('关闭','close')}${preview?button('返回修改','back-preview'):step===2?button('上一步','step:1'):''}${button('校验条件','validate')}${preview?button('确认并保存','commit','class="cp-primary"'):step===1?button('下一步','step:2','class="cp-primary"'):button('预览方案并保存','preview','class="cp-primary"')}</div></footer></section></div>`:'');document.body.style.overflow=isOpen?'hidden':'';const pane=root.querySelector('.modal-content');if(pane)pane.scrollTop=oldScroll;updateTrial();}
function updateTrial(){const el=root.querySelector('#trial-result');if(!el)return;const errors=allErrors();if(errors.length){el.innerHTML=`<div class="cp-error">暂不能试算：${esc(errors[0])}</div>`;return;}if(!precise(trial)){el.innerHTML='<div class="cp-error">请输入非负金额，最多两位小数。</div>';return;}const matches=s.rules.map((r,i)=>({r,i})).filter(x=>matchRule(x.r,trial));if(matches.length!==1){el.innerHTML=matches.length>1?'<div class="cp-error">多条规则同时命中，请调整组合条件。</div>':`<div class="cp-result">未命中任何规则${s.fallback==='manual'?'，转人工核算':'<br><strong>0.00 元</strong>'}</div>`;return;}const {r,i}=matches[0];el.innerHTML=`<div class="cp-result">命中规则${i+1}<br><strong>${calculate(r,trial).toFixed(2)} 元</strong><div class="cp-muted">${esc(formula(r))}</div></div>`;}
function updateLive(i){const r=s.rules[i];const f=root.querySelector('#formula-'+i);if(f)f.textContent='分润金额 = '+formula(r);const d=root.querySelector('#description-'+i);if(d)d.textContent=description(r);updateTrial();keep();}
root.addEventListener('input',e=>{const [a,b]=(e.target.dataset.bind||'').split(':');if(a==='trial'){trial=e.target.value===''?NaN:Number(e.target.value);updateTrial();}else if(a==='fixed'||a==='rate'){s.rules[+b][a]=e.target.value===''?NaN:Number(e.target.value);s.status='草稿';updateLive(+b);}else if(e.target.id==='scheme-notes'){s.notes=e.target.value;s.status='草稿';keep();}});
root.addEventListener('change',e=>{const bind=e.target.dataset.bind;if(!bind)return;const [a,b,c,d]=bind.split(':'),value=e.target.value,r=s.rules[+b];if(['trial','fixed','rate'].includes(a))return;if(a==='rule-logic')r.logic=value;else if(a==='group-logic')r.groups[+c].logic=value;else if(a==='ref-project')r.groups[+c].refs[+d]={project:value,condition:''};else if(a==='ref-condition')r.groups[+c].refs[+d].condition=value;else if(a==='mode')r.mode=value;else if(a==='fallback')s.fallback=value;mutate();});
function referenced(p,c){return s.rules.some(r=>r.groups.some(g=>g.refs.some(ref=>ref.project===p&&(c===undefined||ref.condition===c))));}
root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const [a,b,c,d]=el.dataset.action.split(':');if(a==='team'){changeTeam(b);return;}if(a==='close'){keep();isOpen=false;render();return;}
if(a==='step'){if(editor||newProject){say('请先应用或取消正在编辑的内容，再切换步骤。');return;}if(+b===2){const errs=allErrors(false);if(errs.length){say('请先完善条件项目：'+errs.join('；'));return;}}step=+b;preview=false;message='';resetScroll=true;render();return;}
if(a==='new-project'){newProject=true;render();return;}if(a==='cancel-project'){newProject=false;render();return;}if(a==='create-project'){const value=root.querySelector('#project-metric').value;if(!value){say('请选择条件项目');return;}if(s.projects.some(p=>p.metric===value)){say('该条件项目已创建，请在项目内添加条件');return;}s.projects.push({id:uid(),metric:value,conditions:[{id:uid(),name:'全部金额',min:0,max:null,li:true,ui:false}]});newProject=false;mutate();say('条件项目已创建，默认覆盖全部金额。可编辑现有条件并添加更多区间。');return;}
if(a==='delete-project'){if(referenced(b)){say('该项目已被规则引用，请先删除相关规则或更换引用。');return;}s.projects=s.projects.filter(p=>p.id!==b);editor=null;}
else if(a==='edit-condition'||a==='add-condition'){editor={project:b,isNew:a==='add-condition',draft:a==='edit-condition'?structuredClone(condition(b,c)):{id:uid(),name:'',min:0,max:null,li:true,ui:false}};render();return;}
else if(a==='cancel-condition'){editor=null;render();return;}
else if(a==='save-condition'){const p=project(editor.project),lo=root.querySelector('#condition-min').value,hi=root.querySelector('#condition-max').value;const value={...editor.draft,name:root.querySelector('#condition-name').value.trim(),min:lo===''?NaN:Number(lo),max:hi===''?null:Number(hi),li:root.querySelector('#condition-li').checked,ui:root.querySelector('#condition-ui').checked};const errs=conditionErrors(value);if(p.conditions.some(c=>c.id!==value.id&&c.name===value.name))errs.push('同一项目内的条件名称不能重复');if(errs.length){say(errs.join('；'));return;}if(editor.isNew)p.conditions.push(value);else p.conditions[p.conditions.findIndex(c=>c.id===value.id)]=value;editor=null;}
else if(a==='move-condition'){const p=project(b),index=+c,to=index+(+d);[p.conditions[index],p.conditions[to]]=[p.conditions[to],p.conditions[index]];}
else if(a==='delete-condition'){if(referenced(b,c)){say('该条件已被规则引用，请先更换或移除引用。');return;}project(b).conditions=project(b).conditions.filter(x=>x.id!==c);if(editor?.draft.id===c)editor=null;}
else if(a==='add-rule'){s.rules.push({id:uid(),logic:'or',groups:[{logic:'and',refs:[{project:s.projects[0].id,condition:''}]}],mode:'plus',fixed:0,rate:0,showDescription:false});}
